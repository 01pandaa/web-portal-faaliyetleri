name: Repair Adana SEO structured data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('adana-seo-ajansi/index.html')
          html = p.read_text(encoding='utf-8')
          old = '"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları."\n"primaryImageOfPage":{"@type":"ImageObject","url":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"},}'
          new = '"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları.",\n  "image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"\n}'
          if old not in html:
              old = '"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları."\n"primaryImageOfPage"'
              new = '"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları.",\n  "image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"'
          html = html.replace(old, new, 1)
          html = html.replace('"primaryImageOfPage":{"@type":"ImageObject","url":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"},}', '"image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"\n}', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adana-seo-ajansi/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair Adana SEO structured data"
          git push