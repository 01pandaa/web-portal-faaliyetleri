name: Repair Adana SEO structured data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair JSON-LD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('adana-seo-ajansi/index.html')
          html = p.read_text(encoding='utf-8')

          broken = '"image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp":{"@type":"ImageObject","url":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"},}'
          fixed = '"image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"\n}'

          if broken in html:
              html = html.replace(broken, fixed, 1)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adana-seo-ajansi/index.html
          if git diff --cached --quiet; then
            echo "JSON-LD already valid."
            exit 0
          fi
          git commit -m "fix: repair malformed Adana SEO JSON-LD"
          git push
