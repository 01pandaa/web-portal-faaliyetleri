name: Add image metadata
on:
  push:
    paths:
      - '.github/workflows/add-image-metadata.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add og:image and primaryImageOfPage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mapping = {
            'seo/index.html': ('seo-dogru-yapi-guclu-gorunurluk.webp', 'SEO hizmetinde teknik altyapı ve güçlü arama görünürlüğü için doğru site yapısı'),
            'adana-seo-ajansi/index.html': ('yerel-seo-google-haritalar.webp', 'Yerel SEO ve Google Haritalar görünürlüğü için yerel arama çalışmaları'),
            'google-ads/index.html': ('web-portal-faaliyetleri-dijital-pazarlama.webp', 'Google Ads ve dijital pazarlama çalışmalarında ölçülebilir reklam yönetimi'),
            'dijital-reklam/index.html': ('web-portal-faaliyetleri-dijital-pazarlama.webp', 'Dijital pazarlama ve çevrim içi reklam çalışmalarının bütünsel görünümü'),
            'blog/teknik-seo-nedir/index.html': ('teknik-seo-altyapi.webp', 'Teknik SEO altyapısı, tarama, indeksleme ve site performansı'),
            'blog/google-ads-anahtar-kelime-secimi-2026/index.html': ('google-ads-arama-reklamlari.webp', 'Google Ads arama reklamlarında anahtar kelime ve arama niyeti seçimi'),
            'blog/google-ads-donusum-takibi-2026/index.html': ('google-ads-donusum-takibi.webp', 'Google Ads dönüşüm takibi ve reklam performansının ölçülmesi'),
            'blog/google-ads-ai-max-2026/index.html': ('google-ads-veri-analizi-hedefleme.webp', 'Google Ads AI Max döneminde veri analizi ve hedefleme yaklaşımı'),
            'blog/google-ads-gecersiz-tiklama-2026/index.html': ('google-ads-reklam-ziyaret-donusum.webp', 'Google Ads reklam ziyaretleri, trafik kalitesi ve dönüşüm ilişkisi'),
            'blog/google-ads-nedir/index.html': ('google-ads-dogru-hedefleme.webp', 'Google Ads kampanyalarında doğru hedefleme ve reklam trafiği'),
          }
          base='https://www.webportalfaaliyetleri.com/assets/'
          for file,(img,alt) in mapping.items():
            p=Path(file)
            s=p.read_text(encoding='utf-8')
            url=base+img
            if 'property="og:image"' not in s:
              s=s.replace('</head>',f'<meta property="og:image" content="{url}"></head>',1)
            if 'primaryImageOfPage' not in s:
              if '<script type="application/ld+json">' in s:
                start=s.find('<script type="application/ld+json">')
                end=s.find('</script>',start)
                block=s[start:end]
                pos=block.rfind('}')
                if pos!=-1:
                  block=block[:pos]+f'"primaryImageOfPage":{{"@type":"ImageObject","url":"{url}"}},'+block[pos:]
                  s=s[:start]+block+s[end:]
              else:
                jsonld=f'<script type="application/ld+json">{{"@context":"https://schema.org","@type":"WebPage","url":"https://www.webportalfaaliyetleri.com/{file.rsplit("/",1)[0]}/","primaryImageOfPage":{{"@type":"ImageObject","url":"{url}"}}}}</script>'
                s=s.replace('</head>',jsonld+'</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: add preferred image metadata [skip ci]' || exit 0
          git push

# trigger second run
