name: Fix platform links
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/fix-platform-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage platform links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          def fix_link(text, cls, url):
              pat = rf'(<a\b[^>]*class=["\'][^"\']*\b{cls}\b[^"\']*["\'][^>]*href=["\'])[^"\']*(["\'])'
              return re.sub(pat, rf'\g<1>{url}\g<2>', text, count=1)
          s = fix_link(s, 'ads', 'https://ads.google.com/')
          s = fix_link(s, 'youtube', 'https://www.youtube.com/')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Google Ads and YouTube platform links"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-platform-links.yml
          git commit -m "Remove one-time platform link fixer"
          git push
