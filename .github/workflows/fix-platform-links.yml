name: Fix platform links
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage platform links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n_ads = re.subn(r'(<a\b[^>]*class=["\'][^"\']*platform-link-card\s+ads[^"\']*["\'][^>]*href=["\'])[^"\']*(\2)', r'\1https://ads.google.com/\2', s, count=1)
          if n_ads == 0:
              s = re.sub(r'(<a\b[^>]*class=["\'][^"\']*platform-link-card\s+ads[^"\']*["\'][^>]*?)href=["\'][^"\']*["\']', r'\1href="https://ads.google.com/"', s, count=1)
          s, n_yt = re.subn(r'(<a\b[^>]*class=["\'][^"\']*platform-link-card\s+youtube[^"\']*["\'][^>]*href=["\'])[^"\']*(\2)', r'\1https://www.youtube.com/\2', s, count=1)
          if n_yt == 0:
              s = re.sub(r'(<a\b[^>]*class=["\'][^"\']*platform-link-card\s+youtube[^"\']*["\'][^>]*?)href=["\'][^"\']*["\']', r'\1href="https://www.youtube.com/"', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Google Ads and YouTube platform links"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-platform-links.yml
          git commit -m "Remove one-time platform link fixer"
          git push
