name: Google Ads Cluster Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enrich-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add contextual cross links
        shell: python
        run: |
          from pathlib import Path

          pages = {
              "blog/google-ads-anahtar-kelime-secimi-2026/index.html": '''<section class="section" id="google-ads-next-steps"><div class="section-heading"><span>SONRA</span><h2>Anahtar kelimeden sonra neye bakmalı?</h2></div><p>Anahtar kelime seçimi tek başına kampanyayı tamamlamaz. Seçtiğiniz sorguların bütçe ile nasıl dengeleneceğini <a href="/blog/google-ads-fiyatlari-2026/">Google Ads bütçe rehberinde</a>, hangi aksiyonların sonuç olarak ölçüleceğini <a href="/blog/google-ads-donusum-takibi-2026/">dönüşüm takibi rehberinde</a> ve AI Max'in bu yapıya nasıl dahil olduğunu <a href="/blog/google-ads-ai-max-2026/">AI Max rehberinde</a> inceleyebilirsiniz.</p><p>Genel kampanya akışını görmek için <a href="/blog/google-reklam-verme/">Google'da reklam verme ana rehberine</a> veya doğrudan <a href="/google-ads/">Google Ads hizmet sayfamıza</a> geçebilirsiniz.</p></section>''',
              "blog/google-ads-fiyatlari-2026/index.html": '''<section class="section" id="google-ads-next-steps"><div class="section-heading"><span>SONRA</span><h2>Bütçeyi belirledikten sonra neyi ölçmeli?</h2></div><p>Reklam bütçesi, tek başına başarı ölçüsü değildir. Bütçeyi belirledikten sonra hangi aramaların değer ürettiğini <a href="/blog/google-ads-anahtar-kelime-secimi-2026/">anahtar kelime rehberinde</a>, harcamanın hangi aksiyonlara dönüştüğünü <a href="/blog/google-ads-donusum-takibi-2026/">dönüşüm takibi rehberinde</a> ve AI Max'in kampanya yönetimindeki rolünü <a href="/blog/google-ads-ai-max-2026/">AI Max rehberinde</a> değerlendirebilirsiniz.</p><p>Kampanyanın bütününü görmek için <a href="/blog/google-reklam-verme/">Google'da reklam verme ana rehberine</a> bakabilir veya <a href="/google-ads/">Google Ads hizmet sayfamızdan</a> destek alabilirsiniz.</p></section>''',
              "blog/google-ads-donusum-takibi-2026/index.html": '''<section class="section" id="google-ads-next-steps"><div class="section-heading"><span>SONRA</span><h2>Dönüşümü ölçtükten sonra optimizasyon</h2></div><p>Dönüşüm verisi kampanyanın hangi bölümlerinin işe yaradığını anlamanın temelidir. Bu veriyi <a href="/blog/google-ads-anahtar-kelime-secimi-2026/">anahtar kelime ve arama niyeti</a> ile birlikte değerlendirin; bütçeyi <a href="/blog/google-ads-fiyatlari-2026/">Google Ads bütçe rehberindeki</a> müşteri edinme ekonomisiyle ilişkilendirin ve AI Max kullanıyorsanız <a href="/blog/google-ads-ai-max-2026/">AI Max rehberindeki</a> kontrol noktalarını inceleyin.</p><p>Trafiğin niteliğini ayrıca kontrol etmek için <a href="/blog/google-ads-gecersiz-tiklama-2026/">geçersiz tıklamalar rehberine</a> ve kampanya stratejisinin tamamı için <a href="/blog/google-reklam-verme/">ana rehbere</a> geçebilirsiniz.</p></section>''',
              "blog/google-ads-ai-max-2026/index.html": '''<section class="section" id="google-ads-next-steps"><div class="section-heading"><span>SONRA</span><h2>AI Max'i kampanyanın diğer parçalarıyla birlikte düşünün</h2></div><p>AI Max'i tek başına değerlendirmek yerine kampanyanın temelini oluşturan <a href="/blog/google-ads-anahtar-kelime-secimi-2026/">anahtar kelime ve arama niyeti</a>, <a href="/blog/google-ads-fiyatlari-2026/">bütçe</a> ve <a href="/blog/google-ads-donusum-takibi-2026/">dönüşüm ölçümü</a> ile birlikte ele alın. Böylece otomasyonun hangi ticari hedefe hizmet ettiğini daha net görebilirsiniz.</p><p>Trafik kalitesini değerlendirmek için <a href="/blog/google-ads-gecersiz-tiklama-2026/">geçersiz tıklamalar rehberine</a>, kampanyanın genel kuruluş mantığı için <a href="/blog/google-reklam-verme/">Google'da reklam verme ana rehberine</a> bakabilirsiniz.</p></section>''',
              "blog/google-ads-gecersiz-tiklama-2026/index.html": '''<section class="section" id="google-ads-next-steps"><div class="section-heading"><span>SONRA</span><h2>Trafik kalitesini ölçüm ve bütçeyle birlikte değerlendirin</h2></div><p>Şüpheli veya geçersiz görünen trafiği değerlendirirken yalnızca IP adresine bakmak yeterli değildir. Trafik kalitesini <a href="/blog/google-ads-donusum-takibi-2026/">dönüşüm verileri</a>, <a href="/blog/google-ads-fiyatlari-2026/">bütçe ve müşteri edinme maliyeti</a> ile birlikte okuyun; arama sorgularını ve hedeflemeyi anlamak için <a href="/blog/google-ads-anahtar-kelime-secimi-2026/">anahtar kelime rehberine</a> de bakın.</p><p>AI Max kullanan kampanyalarda otomasyonun rolünü <a href="/blog/google-ads-ai-max-2026/">AI Max rehberinde</a>, kampanyanın genel optimizasyon mantığını ise <a href="/blog/google-reklam-verme/">Google'da reklam verme ana rehberinde</a> inceleyebilirsiniz.</p></section>'''
          }

          for filename, block in pages.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Dosya bulunamadı: {filename}")
              html = path.read_text(encoding="utf-8")
              if 'id="google-ads-next-steps"' in html:
                  print(f"Zaten bağlı: {filename}")
                  continue
              marker = "</main>"
              if marker not in html:
                  raise SystemExit(f"</main> bulunamadı: {filename}")
              html = html.replace(marker, block + marker, 1)
              path.write_text(html, encoding="utf-8")
              print(f"Çapraz link eklendi: {filename}")

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/google-ads-anahtar-kelime-secimi-2026/index.html blog/google-ads-fiyatlari-2026/index.html blog/google-ads-donusum-takibi-2026/index.html blog/google-ads-ai-max-2026/index.html blog/google-ads-gecersiz-tiklama-2026/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Google Ads içerik kümesini çapraz bağla"
          git push
