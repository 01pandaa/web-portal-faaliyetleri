name: Add Kayseri city pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-kayseri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Kayseri pages and homepage card
        shell: python
        run: |
          from pathlib import Path
          import re

          seo = '''<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kayseri SEO Ajansı 2026 | Kayseri Yerel SEO ve Google Görünürlüğü | Web Portal Faaliyetleri</title><meta name="description" content="Kayseri SEO ajansı olarak teknik SEO, yerel SEO, hizmet sayfaları, Google Haritalar ve içerik mimarisi çalışmalarıyla Kayseri'deki işletmelerin organik görünürlüğünü geliştirmeyi hedefliyoruz."><link rel="canonical" href="https://www.webportalfaaliyetleri.com/kayseri-seo-ajansi/"><link rel="stylesheet" href="/assets/css/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","name":"Kayseri SEO Ajansı","serviceType":"SEO ve Yerel SEO","provider":{"@type":"Organization","name":"Web Portal Faaliyetleri","url":"https://www.webportalfaaliyetleri.com/"},"areaServed":{"@type":"City","name":"Kayseri"},"url":"https://www.webportalfaaliyetleri.com/kayseri-seo-ajansi/"}</script></head><body><header class="site-header"><a class="logo" href="/">WEB PORTAL <span>FAALİYETLERİ</span></a><nav aria-label="Ana menü"><a href="/hizmetler/">Hizmetler</a><a href="/google-ads/">Google Ads</a><a href="/seo/">SEO</a><a href="/bot-tiklama-onleme/">Bot Tıklama</a><a href="/blog/">Blog</a><a class="nav-cta" href="tel:+905451944026">0545 194 40 26</a></nav></header><main><section class="city-hero"><div class="eyebrow">KAYSERİ • SEO • YEREL SEO • GOOGLE • 2026</div><h1>Kayseri'de Google'da sadece reklamla değil,<br><em>organik görünürlükle de büyüyün.</em></h1><p>Kayseri SEO çalışmaları; şehir adını sayfaya tekrar tekrar eklemekten ibaret değildir. Teknik altyapı, hizmet sayfaları, kullanıcı niyeti, ilçe bazlı aramalar, Google Haritalar ve işletmenin gerçek hizmet alanı birlikte değerlendirilerek daha anlamlı bir yerel SEO yapısı oluşturulabilir.</p><div class="actions"><a class="btn btn-primary" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer">Kayseri SEO için görüşelim</a><a class="btn btn-secondary" href="/seo/">SEO hizmetini incele</a></div><div class="tags"><span>Kayseri SEO Ajansı</span><span>Kayseri Yerel SEO</span><span>Google Haritalar</span><span>Teknik SEO</span><span>İlçe SEO</span></div></section><section class="section"><div class="section-heading"><span>01</span><h2>Kayseri SEO neden yalnızca “Kayseri” kelimesinden ibaret değil?</h2></div><p class="lead">Bir kullanıcı “Melikgazi diş kliniği”, “Kocasinan hukuk bürosu”, “Talas web tasarım” veya “Kayseri OSB hizmeti” gibi daha spesifik aramalar yapabilir. Her sorgunun arkasındaki ihtiyaç ve beklenen sayfa farklı olabilir.</p><div class="grid"><article class="card light-card"><small>TEKNİK SEO</small><h3>Google'ın sayfanızı anlamasını kolaylaştırın</h3><p>Temiz HTML, başlık yapısı, canonical, yapılandırılmış veri, mobil uyum ve performans gibi teknik unsurlar sağlam bir temel oluşturur.</p></article><article class="card"><small>YEREL SEO</small><h3>Gerçek hizmet alanınızı anlatın</h3><p>Kayseri ve ilçelerindeki hizmet alanı, işletmenin gerçek kapsamını yansıtacak şekilde açıklanmalı; sadece şehir adının tekrarına dayanmamalıdır.</p></article><article class="card dark-card"><small>İÇERİK MİMARİSİ</small><h3>Hizmet + şehir + niyet</h3><p>Hizmet sayfaları, rehber içerikler ve iç bağlantılar birbirini destekleyen anlaşılır bir konu yapısı içinde planlanabilir.</p></article></div></section><section class="section dark"><div class="split-grid"><div><div class="eyebrow">02 / KAYSERİ YEREL SEO</div><h2>İlçe sayfaları ne zaman anlamlıdır?</h2></div><div><p>İlçe bazlı sayfalar ancak farklı bir hizmet alanı, kullanıcı ihtiyacı veya gerçek yerel arama potansiyeli varsa değerli olur. Melikgazi, Kocasinan, Talas, İncesu, Develi, Hacılar, Yahyalı, Bünyan, Pınarbaşı ve diğer ilçeler için içerik oluşturulacaksa her sayfanın gerçekten özgün bir bilgi sunması gerekir.</p><p>Aynı paragrafı yalnızca ilçe adını değiştirerek çoğaltmak yerine, işletmenin o bölgedeki gerçek hizmet kapsamı anlatılmalıdır.</p></div></div></section><section class="section"><div class="section-heading"><span>03</span><h2>Kayseri SEO çalışmalarında odaklandığımız alanlar</h2></div><div class="grid"><article class="card"><h3>Teknik SEO</h3><p>Tarama, indeksleme, canonical, başlıklar, mobil deneyim, performans ve yapılandırılmış veri gibi temel teknik konular.</p></article><article class="card"><h3>Hizmet sayfaları</h3><p>İşletmenin sunduğu hizmetleri gerçek kullanıcı sorularına cevap verecek şekilde açıklayan sayfa mimarisi.</p></article><article class="card"><h3>Yerel SEO</h3><p>Kayseri ve ilgili ilçelerdeki gerçek hizmet alanını destekleyen içerik ve yerel görünürlük çalışmaları.</p></article><article class="card"><h3>Google Haritalar</h3><p>Fiziksel işletmelerin yerel aramalarda daha anlaşılır ve tutarlı bir işletme profiline sahip olmasına yardımcı olan çalışmalar.</p></article><article class="card"><h3>İçerik kümeleri</h3><p>Ana hizmet sayfalarını destekleyen rehberler ve konu kümeleriyle bilgi mimarisini güçlendirme.</p></article><article class="card"><h3>Ölçüm ve iyileştirme</h3><p>Organik görünürlüğü yalnızca sıralamayla değil, trafik ve işletme açısından anlamlı aksiyonlarla birlikte değerlendirme.</p></article></div></section><section class="section"><div class="section-heading"><span>04</span><h2>Kayseri'de SEO ve Google Ads birbirinin alternatifi olmak zorunda değil.</h2></div><p class="lead">Google Ads kısa vadeli ticari aramalarda ücretli görünürlük sağlayabilirken SEO daha uzun vadeli organik görünürlüğü destekleyebilir. İki kanalın aynı hizmet sayfaları ve müşteri niyeti etrafında planlanması dijital yapının bütünlüğünü güçlendirebilir.</p><div class="scenario"><strong>Önemli:</strong> SEO'da amaç “Kayseri” kelimesini mümkün olduğunca çok tekrar etmek değildir. İçerik, kullanıcının gerçekten aradığı hizmeti açıklamalı; şehir ve ilçe bilgisi ise gerçek hizmet kapsamını desteklemelidir.</div></section><section class="section dark"><div class="section-heading"><span>05</span><h2>Kayseri SEO Ajansı seçerken dikkat edin.</h2></div><ol><li>Kopya şehir ve ilçe sayfaları yerine gerçek hizmet alanınıza göre içerik üretiliyor mu?</li><li>Teknik SEO, içerik ve yerel SEO birlikte ele alınıyor mu?</li><li>Google Haritalar ve web sitesi bilgileri tutarlı mı?</li><li>Raporlama yalnızca sıralama değil, organik trafik ve işletme sonuçlarını da inceliyor mu?</li><li>İlçe sayfaları gerçekten farklı kullanıcı ihtiyaçlarına cevap veriyor mu?</li></ol></section><section class="section"><div class="section-heading"><span>06</span><h2>Kayseri SEO + Google Ads + yerel görünürlük</h2></div><p class="lead">Kayseri'deki işletmenizin Google'daki görünürlüğünü tek bir kanala bırakmak yerine SEO, Google Ads, web tasarım, Google Haritalar ve dönüşüm ölçümünü aynı dijital yapı içinde planlayabilirsiniz.</p><div class="actions"><a class="btn btn-primary" href="/kayseri-google-ads/">Kayseri Google Ads Ajansı</a><a class="btn btn-secondary" href="/iletisim/">İletişime geçin</a></div></section></main><footer class="site-footer"><div class="container"><p>© 2026 Web Portal Faaliyetleri</p></div></footer></body></html>'''

          ads = seo.replace('Kayseri SEO Ajansı 2026 | Kayseri Yerel SEO ve Google Görünürlüğü', 'Kayseri Google Ads Ajansı 2026 | Kayseri Google Reklam Yönetimi').replace('Kayseri SEO için görüşelim', 'Kayseri Google Ads için görüşelim').replace('Kayseri SEO Ajansı', 'Kayseri Google Ads Ajansı').replace('Kayseri SEO', 'Kayseri Google Ads').replace('/kayseri-seo-ajansi/', '/kayseri-google-ads/')

          Path('kayseri-seo-ajansi').mkdir(exist_ok=True)
          Path('kayseri-google-ads').mkdir(exist_ok=True)
          Path('kayseri-seo-ajansi/index.html').write_text(seo, encoding='utf-8')
          Path('kayseri-google-ads/index.html').write_text(ads, encoding='utf-8')

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          card = '<div class="city-card featured" id="WPF-KAYSERI-CITY-CARD"><div class="city-label">AKTİF BÖLGE</div><h3>Kayseri</h3><p>Kayseri\'de Google Ads ve SEO çalışmalarını şehir geneline sınırlamıyor; Melikgazi, Kocasinan, Talas, İncesu, Develi, Hacılar ve diğer önemli bölgelerde farklı arama niyetlerini ele alıyoruz.</p><a href="/kayseri-google-ads/">Kayseri Google Ads Ajansı -</a><a href="/kayseri-seo-ajansi/">Kayseri SEO Ajansı -</a></div>'
          grid_match = re.search(r'<div class="city-grid">.*?</div>\s*</section>', html, re.S)
          if not grid_match:
              raise SystemExit('city-grid alanı bulunamadı')
          if 'WPF-KAYSERI-CITY-CARD' not in html:
              block = grid_match.group(0)
              if 'Mersin</h3>' in block:
                  block = block.replace('</div>', '</div>', 1)
                  pos = block.find('Mersin</h3>')
                  end = block.find('</div>', pos)
                  block = block[:end+6] + card + block[end+6:]
              else:
                  block = block.replace('</div></section>', card + '</div></section>')
              html = html[:grid_match.start()] + block + html[grid_match.end():]
          p.write_text(html, encoding='utf-8')

          sm = Path('sitemap.xml')
          sitemap = sm.read_text(encoding='utf-8')
          entries = ['  <url><loc>https://www.webportalfaaliyetleri.com/kayseri-google-ads/</loc></url>', '  <url><loc>https://www.webportalfaaliyetleri.com/kayseri-seo-ajansi/</loc></url>']
          for entry in entries:
              if entry not in sitemap:
                  sitemap = sitemap.replace('</urlset>', entry + '\n</urlset>')
          sm.write_text(sitemap, encoding='utf-8')

      - name: Verify generated files
        shell: bash
        run: |
          test -f kayseri-seo-ajansi/index.html
          test -f kayseri-google-ads/index.html
          grep -q 'WPF-KAYSERI-CITY-CARD' index.html
          grep -q 'kayseri-google-ads' sitemap.xml
          grep -q 'kayseri-seo-ajansi' sitemap.xml

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml kayseri-seo-ajansi/index.html kayseri-google-ads/index.html
          git commit -m 'feat: add Kayseri local SEO and Google Ads pages'
          rm -f .github/workflows/add-kayseri.yml
          git add .github/workflows/add-kayseri.yml
          git commit -m 'chore: remove one-time Kayseri workflow'
          git push