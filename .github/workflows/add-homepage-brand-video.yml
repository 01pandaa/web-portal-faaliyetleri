name: Fix homepage brand video path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-brand-video-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix homepage video source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = 'assets/videos/web-portal-faaliyetleri-tanitim.mp4'
          new = 'assets/Generating_digital_map_video_seq…_202609031415.mp4'

          if old not in html:
              print('Homepage video source already correct or missing; nothing to do.')
              raise SystemExit(0)

          html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          print('Homepage video source corrected.')
          PY

      - name: Commit homepage fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ana sayfa video dosya yolunu duzelt"
          git push
