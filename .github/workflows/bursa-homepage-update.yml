name: Bursa local SEO pages and city card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-bursa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bursa pages and homepage links
        shell: python
        run: |
          from pathlib import Path

          def write_if_missing(path, content):
              p = Path(path)
              if p.exists():
                  return False
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
              return True

          shared_head = '''<link rel="stylesheet" href="/assets/css/style.css"><style>
          .city-hero{background:linear-gradient(135deg,#0b0f14,#183137);color:#fff;padding:90px 7%}.city-hero h1{font-size:clamp(42px,6vw,76px);line-height:1;max-width:1100px;letter-spacing:-3px}.city-hero h1 em{font-style:normal;color:#8bd3c7}.city-hero p{max-width:850px;color:#bac5ca;font-size:19px;margin:25px 0;line-height:1.75}.tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px}.tags span{border:1px solid #405158;border-radius:999px;padding:8px 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid #dce3e5;border-radius:16px;padding:26px;background:#fff}.card h3{margin:9px 0;font-size:23px}.card p{font-size:14px;color:#69747b;line-height:1.75}.dark-card{background:#11191f;color:#fff;border-color:#27333b}.dark-card p{color:#aeb8be}.light-card{background:#e7f6f3}.split-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:25px;align-items:start}.scenario{border-left:4px solid #8bd3c7;background:#f1f6f5;padding:26px;border-radius:10px;line-height:1.75}.faq details{border-top:1px solid #dce3e5;padding:18px 0}.faq summary{font-weight:800;cursor:pointer}@media(max-width:800px){.grid,.split-grid{grid-template-columns:1fr}}
          </style>'''
          header = '''<header class="site-header"><a class="logo" href="/">WEB PORTAL <span>FAALİYETLERİ</span></a><nav aria-label="Ana menü"><a href="/hizmetler/">Hizmetler</a><a href="/google-ads/">Google Ads</a><a href="/seo/">SEO</a><a href="/bot-tiklama-onleme/">Bot Tıklama</a><a href="/blog/">Blog</a><a class="nav-cta" href="tel:+905451944026">0545 194 40 26</a></nav></header>'''
          footer = '''<footer class="site-footer"><div class="container"><p>© 2026 Web Portal Faaliyetleri</p></div></footer>'''

          google_ads = '''<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bursa Google Ads Ajansı 2026 | Google Reklam Yönetimi | Web Portal Faaliyetleri</title><meta name="description" content="Bursa Google Ads ajansı olarak Google reklam yönetimi, dönüşüm takibi, web tasarım, SEO, yerel görünürlük ve reklam trafiği analizi çözümleri sunuyoruz."><link rel="canonical" href="https://www.webportalfaaliyetleri.com/bursa-google-ads/">''' + shared_head + '''<script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","name":"Bursa Google Ads Ajansı","serviceType":"Google Ads Reklam Yönetimi","provider":{"@type":"Organization","name":"Web Portal Faaliyetleri","url":"https://www.webportalfaaliyetleri.com/"},"areaServed":{"@type":"City","name":"Bursa"},"url":"https://www.webportalfaaliyetleri.com/bursa-google-ads/"}</script></head><body>''' + header + '''<main><section class="city-hero"><div class="eyebrow">BURSA • GOOGLE ADS • SEO • WEB TASARIM • 2026</div><h1>Bursa'da Google'da görünmek mi istiyorsunuz?<br><em>Doğru arama, doğru bölge, doğru dönüşüm.</em></h1><p>Bursa'da Google reklamı vermek isteyen işletmeler için kampanya hedefleri; yalnızca tıklama sayısına değil, arama niyetine, hizmet bölgesine, dönüşümlere ve reklam trafiğinin kalitesine göre planlanabilir. Google Ads, web sitesi, SEO ve yerel görünürlüğü aynı müşteri yolculuğunda ele alıyoruz.</p><div class="actions"><a class="btn btn-primary" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer">Bursa için görüşelim</a><a class="btn btn-secondary" href="/google-ads/">Google Ads hizmetini incele</a></div><div class="tags"><span>Bursa Google Ads</span><span>Google Reklam</span><span>Yerel Hedefleme</span><span>Dönüşüm Takibi</span><span>SEO</span><span>Google Haritalar</span></div></section><section class="section"><div class="section-heading"><span>01</span><h2>Bursa'da Google Ads reklamı verirken önce arama niyetini anlayın.</h2></div><p class="lead">“Bursa web tasarım”, “Nilüfer diş kliniği”, “Osmangazi oto servis”, “Yıldırım kombi servisi” veya işletmenizin sunduğu belirli bir hizmeti arayan kullanıcıların niyeti aynı değildir. Kampanya yapısı bu farklılıkları dikkate almalı ve reklam mesajını aranan hizmetle eşleştirmelidir.</p><div class="grid"><article class="card light-card"><small>ARAMA REKLAMLARI</small><h3>Doğru kullanıcıya ulaşın</h3><p>Anahtar kelimeleri, arama terimlerini, lokasyonu ve reklam mesajlarını ticari niyetle birlikte değerlendirin.</p></article><article class="card"><small>DÖNÜŞÜM</small><h3>Tıklamadan sonrasını ölçün</h3><p>Telefon, WhatsApp, form, teklif veya satış gibi işletme açısından değerli aksiyonları ölçülebilir hale getirin.</p></article><article class="card dark-card"><small>TRAFİK KALİTESİ</small><h3>Bütçeyi daha bilinçli okuyun</h3><p>Şüpheli veya olağandışı davranışları değerlendirirken tek bir IP adresini kanıt kabul etmeyin; birden fazla sinyali birlikte inceleyin.</p></article></div></section><section class="section dark"><div class="split-grid"><div><div class="eyebrow">02 / BURSA GOOGLE ADS</div><h2>Reklam bütçeniz kadar, gelen trafiğin niteliği de önemli.</h2></div><div><p>Bir kampanyanın çok tıklama alması otomatik olarak başarılı olduğu anlamına gelmez. Arama sorguları, hizmet alanı, cihaz, zaman, dönüşüm ve kullanıcı davranışı birlikte değerlendirildiğinde bütçenin hangi trafik kaynaklarında değer ürettiği daha iyi anlaşılır.</p><p>Google'ın geçersiz tıklamaları filtrelemesi önemli bir güvenlik katmanıdır; işletmenin kendi analizinde ise olağandışı örüntüler ayrıca incelenebilir.</p><a class="text-link" href="/blog/bursa-google-ads-reklam-sorunlari-2026/">Bursa Google Ads sorunları rehberini okuyun →</a></div></div></section><section class="section"><div class="section-heading"><span>03</span><h2>Bursa'da hangi bölgeler için Google Ads planlanabilir?</h2></div><p class="lead">Hedefleme, işletmenin gerçekten hizmet verdiği bölgeye göre kurulmalıdır. Her işletmenin Bursa'nın tamamına reklam vermesi gerekmez; bazı işletmeler için belirli ilçeler veya hizmet alanları daha anlamlı olabilir.</p><div class="grid"><article class="card"><h3>Nilüfer</h3><p>Sağlık, eğitim, danışmanlık, profesyonel hizmetler, teknoloji, güzellik ve kurumsal işletmeler için farklı arama niyetleri değerlendirilebilir.</p></article><article class="card"><h3>Osmangazi</h3><p>Merkezdeki geniş müşteri havuzu nedeniyle yerel hizmet, sağlık, otomotiv, bakım ve ticari aramalar ayrı incelenebilir.</p></article><article class="card"><h3>Yıldırım</h3><p>Yerel servisler, sağlık, eğitim, ev hizmetleri ve perakende aramalarında hizmet alanının net tanımlanması önemlidir.</p></article><article class="card"><h3>Mudanya</h3><p>Yerel hizmet, konaklama, yeme-içme, gayrimenkul ve dönemsel talep bulunan işletmeler için bölgesel strateji değerlendirilebilir.</p></article><article class="card"><h3>Gürsu</h3><p>İşletmenin müşteri çevresine göre ilçe bazlı arama niyetleri ve hizmet kapsamı ayrıca ele alınabilir.</p></article><article class="card"><h3>Kestel ve İnegöl</h3><p>Bursa merkezinden farklı müşteri alanlarına sahip işletmelerde hizmet bölgesi ve arama hacmi ayrı değerlendirilmelidir.</p></article></div></section><section class="section"><div class="section-heading"><span>04</span><h2>Bursa'da Google Ads + SEO + web tasarım birlikte nasıl çalışır?</h2></div><div class="scenario"><strong>Örnek:</strong> Bursa'daki bir servis işletmesi “Bursa beyaz eşya servisi” aramasında reklam veriyor. Kullanıcı reklama tıklıyor fakat ana sayfada aradığı hizmeti bulmak için dolaşmak zorunda kalıyor. Daha iyi bir yapı; aranan hizmeti doğrudan anlatan landing page, net telefon/WhatsApp çağrısı, mobil uyum ve dönüşüm ölçümüdür. SEO çalışması da zaman içinde organik görünürlüğü destekleyebilir.</div></section><section class="section dark"><div class="section-heading"><span>05</span><h2>Bursa Google Ads Ajansı seçerken hangi soruları sormalısınız?</h2></div><ol><li>Hangi arama terimlerinden trafik geldiğini görebiliyor muyum?</li><li>Telefon, form ve WhatsApp dönüşümleri ölçülüyor mu?</li><li>Hizmet alanım dışındaki aramalar nasıl kontrol ediliyor?</li><li>Negatif anahtar kelimeler ve arama terimleri düzenli inceleniyor mu?</li><li>Reklam trafiği analizinde tek bir IP adresi “bot” kabul ediliyor mu, yoksa birden fazla sinyal birlikte mi değerlendiriliyor?</li><li>Raporlama tıklama sayısına mı, gerçek ticari sonuca mı odaklanıyor?</li></ol></section><section class="section"><div class="section-heading"><span>06</span><h2>Bursa'da Google Ads, SEO ve yerel görünürlüğü birlikte güçlendirin.</h2></div><p class="lead">Web Portal Faaliyetleri olarak Bursa için Google Ads yönetimi, SEO, web tasarım, Google Haritalar görünürlüğü, dönüşüm takibi ve reklam trafiği analizini birbirinden kopuk hizmetler yerine aynı dijital müşteri yolculuğunun parçaları olarak ele alıyoruz.</p><div class="actions"><a class="btn btn-primary" href="/bursa-seo-ajansi/">Bursa SEO Ajansı</a><a class="btn btn-secondary" href="/iletisim/">İletişime geçin</a></div></section></main>''' + footer + '''</body></html>'''

          seo = '''<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bursa SEO Ajansı 2026 | Bursa Yerel SEO ve Google Görünürlüğü | Web Portal Faaliyetleri</title><meta name="description" content="Bursa SEO ajansı olarak teknik SEO, yerel SEO, hizmet sayfaları, Google Haritalar görünürlüğü ve içerik mimarisi çalışmalarıyla Bursa'daki işletmelerin Google görünürlüğünü geliştirmeyi hedefliyoruz."><link rel="canonical" href="https://www.webportalfaaliyetleri.com/bursa-seo-ajansi/">''' + shared_head + '''<script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","name":"Bursa SEO Ajansı","serviceType":"SEO ve Yerel SEO","provider":{"@type":"Organization","name":"Web Portal Faaliyetleri","url":"https://www.webportalfaaliyetleri.com/"},"areaServed":{"@type":"City","name":"Bursa"},"url":"https://www.webportalfaaliyetleri.com/bursa-seo-ajansi/"}</script></head><body>''' + header + '''<main><section class="city-hero"><div class="eyebrow">BURSA • SEO • YEREL SEO • GOOGLE • 2026</div><h1>Bursa'da Google'da sadece reklamla değil,<br><em>organik görünürlükle de büyüyün.</em></h1><p>Bursa SEO çalışmaları; şehir adını sayfaya tekrar tekrar eklemekten ibaret değildir. Teknik altyapı, hizmet sayfaları, kullanıcı niyeti, ilçe bazlı aramalar, Google Haritalar ve işletmenin gerçek hizmet alanı birlikte değerlendirilerek daha anlamlı bir yerel SEO mimarisi oluşturulabilir.</p><div class="actions"><a class="btn btn-primary" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer">Bursa SEO için görüşelim</a><a class="btn btn-secondary" href="/seo/">SEO hizmetini incele</a></div><div class="tags"><span>Bursa SEO Ajansı</span><span>Bursa Yerel SEO</span><span>Google Haritalar</span><span>Teknik SEO</span><span>İlçe SEO</span></div></section><section class="section"><div class="section-heading"><span>01</span><h2>Bursa SEO neden yalnızca “Bursa” kelimesinden ibaret değil?</h2></div><p class="lead">Bir kullanıcı “Nilüfer diş kliniği”, “Osmangazi hukuk bürosu”, “Mudanya web tasarım” veya “İnegöl mobilya firması” gibi daha spesifik bir arama yapabilir. Bu sorguların her biri farklı bir ihtiyacı ve farklı bir sayfa beklentisini temsil eder.</p><div class="grid"><article class="card light-card"><small>TEKNİK SEO</small><h3>Google'ın sayfanızı anlamasını kolaylaştırın</h3><p>Temiz HTML yapısı, başlıklar, canonical, yapılandırılmış veri, mobil uyum ve performans gibi teknik unsurlar temel oluşturur.</p></article><article class="card"><small>YEREL SEO</small><h3>Gerçek hizmet alanınızı anlatın</h3><p>İlçe ve bölge sayfaları yalnızca arama motoru için değil, gerçekten o bölgede hizmet alan kullanıcı için faydalı olacak şekilde hazırlanmalıdır.</p></article><article class="card dark-card"><small>İÇERİK MİMARİSİ</small><h3>Hizmet + şehir + niyet</h3><p>Her sayfaya aynı metni kopyalamak yerine arama niyetine göre özgün ve birbirini destekleyen bir sayfa yapısı oluşturun.</p></article></div></section><section class="section dark"><div class="split-grid"><div><div class="eyebrow">02 / BURSA YEREL SEO</div><h2>İlçe sayfaları ne zaman anlamlıdır?</h2></div><div><p>İlçe bazlı sayfalar ancak gerçekten farklı bir arama niyeti, hizmet alanı veya kullanıcı ihtiyacı varsa değerli olur. Aynı paragrafı Bursa'nın bütün ilçelerine kopyalamak yerine Nilüfer, Osmangazi, Yıldırım, Mudanya, Gürsu, Kestel ve İnegöl gibi bölgelerde işletmenin gerçek hizmet kapsamına göre özgün içerik oluşturulmalıdır.</p><p>Bu yaklaşım hem kullanıcıya daha net bilgi verir hem de sitenin şehir ve hizmet ilişkisini daha anlaşılır hale getirir.</p></div></div></section><section class="section"><div class="section-heading"><span>03</span><h2>Bursa SEO çalışmalarında odaklandığımız alanlar</h2></div><div class="grid"><article class="card"><h3>Teknik SEO</h3><p>Tarama, indeksleme, canonical, başlık yapısı, mobil deneyim, sayfa hızı ve yapılandırılmış veri gibi temel teknik konular.</p></article><article class="card"><h3>Hizmet sayfaları</h3><p>İşletmenin sunduğu hizmetleri gerçek kullanıcı sorularına cevap verecek şekilde açıklayan sayfa mimarisi.</p></article><article class="card"><h3>Yerel SEO</h3><p>Bursa ve ilgili ilçelerdeki gerçek hizmet alanını destekleyen içerik, işletme bilgileri ve yerel görünürlük çalışmaları.</p></article><article class="card"><h3>Google Haritalar</h3><p>Fiziksel işletmelerin yerel aramalarda daha anlaşılır bir işletme profiline sahip olmasına yardımcı olacak çalışmalar.</p></article><article class="card"><h3>İçerik kümeleri</h3><p>Ana hizmet sayfasını destekleyen rehberler ve konu kümeleriyle bilgi mimarisini güçlendirme.</p></article><article class="card"><h3>Ölçüm ve iyileştirme</h3><p>Organik görünürlüğü yalnızca sıralama ekranıyla değil, trafik ve işletme açısından anlamlı aksiyonlarla birlikte değerlendirme.</p></article></div></section><section class="section"><div class="section-heading"><span>04</span><h2>Bursa'da SEO ve Google Ads birbirinin alternatifi olmak zorunda değil.</h2></div><p class="lead">Google Ads kısa vadeli ticari aramalarda ücretli görünürlük sağlayabilirken SEO daha uzun vadeli organik görünürlüğü destekleyebilir. İki kanalın aynı hizmet sayfaları ve aynı müşteri niyeti etrafında planlanması, web sitesinin bütünlüğünü güçlendirebilir.</p><div class="scenario"><strong>Önemli:</strong> SEO'da amaç yalnızca “Bursa” kelimesini sayfaya mümkün olduğunca çok eklemek değildir. İçerik, kullanıcının gerçekten aradığı hizmeti açıklamalı; şehir ve ilçe bilgisi ise gerçek hizmet kapsamını desteklemelidir.</div></section><section class="section dark"><div class="section-heading"><span>05</span><h2>Bursa SEO Ajansı seçerken dikkat edin.</h2></div><ol><li>Size kopya şehir sayfaları mı sunuyor, yoksa gerçek hizmet alanınıza göre içerik mi üretiyor?</li><li>Teknik SEO ile içerik ve yerel SEO birlikte ele alınıyor mu?</li><li>Google Haritalar ve web sitesi bilgileri tutarlı mı?</li><li>Raporlama yalnızca sıralama mı gösteriyor, yoksa organik trafik ve işletme sonuçlarını da inceliyor mu?</li><li>İlçe sayfaları gerçekten farklı kullanıcı ihtiyaçlarına cevap veriyor mu?</li></ol></section><section class="section"><div class="section-heading"><span>06</span><h2>Bursa SEO + Google Ads + yerel görünürlük</h2></div><p class="lead">Bursa'daki işletmenizin Google'daki görünürlüğünü tek bir sayfaya veya tek bir kanala bırakmak yerine; SEO, Google Ads, web tasarım, Google Haritalar ve dönüşüm ölçümünü aynı dijital yapı içinde planlayabilirsiniz.</p><div class="actions"><a class="btn btn-primary" href="/bursa-google-ads/">Bursa Google Ads Ajansı</a><a class="btn btn-secondary" href="/iletisim/">İletişime geçin</a></div></section></main>''' + footer + '''</body></html>'''

          write_if_missing('bursa-google-ads/index.html', google_ads)
          write_if_missing('bursa-seo-ajansi/index.html', seo)

          # Homepage: city-card başlıklarını görünür yap ve Bursa'yı mevcut şehir kümesine ekle.
          home = Path('index.html')
          html = home.read_text(encoding='utf-8')
          if 'WPF-BURSA-CITY-CARD' not in html:
              style = '<style id="WPF-BURSA-CITY-CARD">.city-card h3,.city-card.featured h3{color:#158d7d !important}.city-card .city-label{color:#158d7d !important}</style>'
              html = html.replace('</head>', style + '</head>', 1)
              bursa_card = '<div class="city-card featured" id="WPF-BURSA-CITY-CARD"><div class="city-label">AKTİF BÖLGE</div><h3>Bursa</h3><p>Bursa\'da Google Ads ve SEO çalışmalarını şehir geneline sınırlamıyor; Nilüfer, Osmangazi, Yıldırım, Mudanya, Gürsu, Kestel ve İnegöl gibi önemli bölgelerde farklı arama niyetlerini ayrıca ele alıyoruz.</p><a href="/bursa-google-ads/">Bursa Google Ads Ajansı →</a><a href="/bursa-seo-ajansi/">Bursa SEO Ajansı →</a></div>'
              # Bursa'yı Mersin kartının hemen sonuna, şehir kartı kapanışından sonra ekle.
              marker = '<a href="/mersin-seo-ajansi/">Mersin SEO Ajansı →</a>'
              pos = html.find(marker)
              if pos != -1:
                  card_end = html.find('</div>', pos)
                  if card_end != -1:
                      card_end += len('</div>')
                      html = html[:card_end] + bursa_card + html[card_end:]
              else:
                  grid_pos = html.find('<div class="city-grid">')
                  if grid_pos != -1:
                      close = html.find('</div>', grid_pos)
                      if close != -1:
                          html = html[:close] + bursa_card + html[close:]
              home.write_text(html, encoding='utf-8')

          # Sitemap'e Bursa hizmet sayfalarını ve Bursa rehberini ekle.
          sm = Path('sitemap.xml')
          s = sm.read_text(encoding='utf-8')
          additions = [
              'https://www.webportalfaaliyetleri.com/bursa-google-ads/',
              'https://www.webportalfaaliyetleri.com/bursa-seo-ajansi/',
              'https://www.webportalfaaliyetleri.com/blog/bursa-google-ads-reklam-sorunlari-2026/'
          ]
          for url in additions:
              if url not in s:
                  s = s.replace('</urlset>', f'  <url><loc>{url}</loc></url>\n</urlset>')
          sm.write_text(s, encoding='utf-8')

      - name: Commit Bursa update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml bursa-google-ads/index.html bursa-seo-ajansi/index.html .github/workflows/bursa-homepage-update.yml
          if git diff --cached --quiet; then
            echo 'No Bursa changes needed.'
            exit 0
          fi
          git commit -m 'feat: add Bursa local SEO pages and city card'
          git push
