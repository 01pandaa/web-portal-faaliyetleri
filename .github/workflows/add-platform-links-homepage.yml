name: Add platform links to homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-platform-links:
    if: "!contains(github.event.head_commit.message, '[platform-links]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<!-- WPF-PLATFORM-LINKS -->'
          if marker in html:
              print('Platform links already present.')
              raise SystemExit(0)

          css = r'''<style id="WPF-PLATFORM-LINKS-CSS">
          .platform-links{padding:54px 0 10px}.platform-links-head{text-align:center;max-width:760px;margin:0 auto 28px}.platform-links-head small{display:block;color:#158d7d;font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:9px}.platform-links-head h2{font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0}.platform-links-head p{color:#68737c;margin:11px auto 0;max-width:650px;font-size:14px;line-height:1.7}.platform-links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform-link-card{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid #dce2e5;border-radius:16px;background:#fff;text-decoration:none;color:#111820;transition:transform .2s,box-shadow .2s,border-color .2s}.platform-link-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0000000d;border-color:#b9ddd6}.platform-link-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;background:#f4f7f7;border:1px solid #e0e6e7}.platform-link-icon svg{width:28px;height:28px;display:block}.platform-link-copy{min-width:0}.platform-link-copy strong{display:block;font-size:15px;line-height:1.2}.platform-link-copy span{display:block;margin-top:5px;color:#68737c;font-size:12px;line-height:1.35}.platform-link-arrow{margin-left:auto;color:#158d7d;font-size:20px;font-weight:700}.platform-link-card.ads .platform-link-icon{background:#fff8e9}.platform-link-card.google .platform-link-icon{background:#f7f9ff}.platform-link-card.chatgpt .platform-link-icon{background:#f2faf8}.platform-link-card.youtube .platform-link-icon{background:#fff3f3}@media(max-width:900px){.platform-links-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.platform-links{padding-top:38px}.platform-links-grid{grid-template-columns:1fr}.platform-link-card{padding:16px}}
          </style>'''

          section = r'''<!-- WPF-PLATFORM-LINKS -->
          <section class="section platform-links" aria-labelledby="platform-links-title">
            <div class="platform-links-head">
              <small>FAYDALI PLATFORMLAR</small>
              <h2>Google Ads, Google, YouTube ve ChatGPT</h2>
              <p>Web Portal Faaliyetleri ile çalışırken kullandığımız ve hızlıca ulaşabileceğiniz platformlar.</p>
            </div>
            <div class="platform-links-grid">
              <a class="platform-link-card ads" href="/google-ads/" aria-label="Google Ads hizmetleri">
                <span class="platform-link-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" role="img"><path d="M8 25a4 4 0 0 1-3.45-6L13.7 5.5a4 4 0 1 1 6.9 4L11.45 23A4 4 0 0 1 8 25Z" fill="#fbbc04"/><path d="M19.6 5.5a4 4 0 0 1 6.9 4l-8.8 15.25a4 4 0 0 1-6.9-4Z" fill="#4285f4"/><path d="M19.6 5.5a4 4 0 0 1 6.9 4l-4.15 7.2-6.9-4Z" fill="#34a853"/></svg>
                </span>
                <span class="platform-link-copy"><strong>Google Ads</strong><span>Reklam yönetimi ve optimizasyon</span></span><span class="platform-link-arrow" aria-hidden="true">→</span>
              </a>
              <a class="platform-link-card google" href="https://www.google.com/" target="_blank" rel="noopener noreferrer" aria-label="Google'a git">
                <span class="platform-link-icon" aria-hidden="true"><span style="font-size:29px;font-weight:900;font-family:Arial,sans-serif;background:linear-gradient(90deg,#4285f4 0 27%,#34a853 27% 50%,#fbbc05 50% 73%,#ea4335 73%);-webkit-background-clip:text;background-clip:text;color:transparent">G</span></span>
                <span class="platform-link-copy"><strong>Google'a Sor</strong><span>Google'da hızlıca arayın</span></span><span class="platform-link-arrow" aria-hidden="true">↗</span>
              </a>
              <a class="platform-link-card chatgpt" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" aria-label="ChatGPT'yi aç">
                <span class="platform-link-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 5.2a6.2 6.2 0 0 1 5.9 4.3 6.2 6.2 0 0 1 4.5 7.8 6.2 6.2 0 0 1-5.2 8.1 6.2 6.2 0 0 1-7.3 1.7 6.2 6.2 0 0 1-6.1-7.6 6.2 6.2 0 0 1 1.8-8.2A6.2 6.2 0 0 1 16 5.2Z" stroke="#158d7d" stroke-width="2.2"/><path d="m11.4 10.1 9.3 5.4v6.1M20.7 10.1l-9.3 5.4v6.1M8.8 13.2l5.2 3v6M23.2 13.2l-5.2 3v6" stroke="#158d7d" stroke-width="1.8" stroke-linecap="round"/></svg></span>
                <span class="platform-link-copy"><strong>ChatGPT'ye Sor</strong><span>Fikir, içerik ve araştırma desteği</span></span><span class="platform-link-arrow" aria-hidden="true">↗</span>
              </a>
              <a class="platform-link-card youtube" href="https://www.youtube.com/@dyt.tugbasekeragac" target="_blank" rel="noopener noreferrer" aria-label="YouTube kanalını aç">
                <span class="platform-link-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="5" fill="#ff0000"/><path d="m13 11.5 8 4.5-8 4.5Z" fill="#fff"/></svg></span>
                <span class="platform-link-copy"><strong>YouTube</strong><span>Videolar ve dijital içerikler</span></span><span class="platform-link-arrow" aria-hidden="true">↗</span>
              </a>
            </div>
          </section>
          '''

          body_marker = '<!-- WPF-BRAND-VIDEO -->'
          if body_marker not in html:
              raise SystemExit('Homepage insertion marker not found.')

          html = html.replace('</style><script type="application/ld+json">', '</style>' + css + '<script type="application/ld+json">', 1)
          html = html.replace(body_marker, section + body_marker, 1)
          path.write_text(html, encoding='utf-8')
          print('Homepage platform links added.')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-platform-links-homepage.yml
          git commit -m "Add platform links to homepage [platform-links]"
          git rm .github/workflows/add-platform-links-homepage.yml
          git commit -m "Remove one-time platform links workflow [platform-links]"
          git push
