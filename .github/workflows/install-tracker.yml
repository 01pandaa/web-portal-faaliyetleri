name: Install Bot Click Tracker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-tracker:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[tracker-installed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add tracker, carousel and final video SEO fixes
        shell: python
        run: |
          from pathlib import Path
          import re, shutil
          tracker='<script src="https://01pandaa.github.io/bot-tiklama-engelleme/tracker/tracker.js" defer></script>'
          video_old='Generating_digital_map_video_seq…_202609031415.mp4'
          video_new='web-portal-faaliyetleri-tanitim.mp4'
          src=Path('assets')/video_old
          dst=Path('assets')/video_new
          if src.exists() and not dst.exists():
              shutil.copyfile(src,dst)
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts: continue
              s=path.read_text(encoding='utf-8'); changed=False
              if 'bot-tiklama-engelleme/tracker/tracker.js' not in s and '</head>' in s:
                  s=s.replace('</head>',tracker+'</head>',1); changed=True
              if path.as_posix()=='index.html':
                  s=s.replace('autopla muted\n      <source','autoplay muted>\n      <source')
                  s=s.replace('type="video/mp4" autopla mute playsinline\n','type="video/mp4">\n')
                  s=s.replace('</video autoplay','</video>')
                  s=s.replace('assets/'+video_old,'/assets/'+video_new)
                  s=s.replace('/assets/'+video_old,'/assets/'+video_new)
                  s=s.replace('playsinline style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:#05080b" autoplay muted>','playsinline poster="/assets/web-portal-faaliyetleri-dijital-pazarlama.webp" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:#05080b" autoplay muted>')
                  thumb='https://www.webportalfaaliyetleri.com/assets/web-portal-faaliyetleri-dijital-pazarlama.webp'
                  watch='https://www.webportalfaaliyetleri.com/video/web-portal-faaliyetleri-tanitim/'
                  content='https://www.webportalfaaliyetleri.com/assets/'+video_new
                  schema='<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoObject","name":"Web Portal Faaliyetleri Tanıtım Videosu","description":"Web Portal Faaliyetleri; Google Ads, SEO, web tasarım, dijital reklam ve reklam güvenliği çözümlerini tanıtan marka videosu.","thumbnailUrl":["'+thumb+'"],"uploadDate":"2026-09-03T12:30:35+00:00","contentUrl":"'+content+'","url":"'+watch+'"}</script>'
                  if '"@type":"VideoObject"' not in s:
                      s=s.replace('</head>',schema+'</head>',1); changed=True
              if path.as_posix()=='video/web-portal-faaliyetleri-tanitim/index.html':
                  ns=s.replace('src="assets/'+video_old+'"','src="/assets/'+video_new+'"')
                  ns=ns.replace('src="/assets/'+video_old+'"','src="/assets/'+video_new+'"')
                  ns=ns.replace('<video controls preload="metadata" playsinline>','<video controls preload="metadata" playsinline poster="/assets/web-portal-faaliyetleri-dijital-pazarlama.webp">')
                  if ns!=s: s=ns; changed=True
              if changed: path.write_text(s,encoding='utf-8')
          sitemap=Path('sitemap.xml')
          if sitemap.exists():
              s=sitemap.read_text(encoding='utf-8')
              s=s.replace(video_old,video_new)
              sitemap.write_text(s,encoding='utf-8')
      - name: Ensure city carousel helper remains installed
        shell: bash
        run: |
          grep -q 'WPF-CITY-CAROUSEL' index.html || true
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' sitemap.xml assets/web-portal-faaliyetleri-tanitim.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install bot click tracker and video SEO fixes [tracker-installed]'
          git push
