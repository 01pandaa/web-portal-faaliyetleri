name: Install Bot Click Tracker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-tracker:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[tracker-installed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair homepage video markup
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</video autoplay','</video>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix homepage video HTML [tracker-installed]'
          git push
