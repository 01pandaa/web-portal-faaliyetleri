name: Fix Google Ads Price Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy Google Ads price URL
        shell: python
        run: |
          from pathlib import Path
          old = "/blog/google-ads-fiyatlari-2026/"
          new = "/blog/google-ads-fiyatlari/"
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          print(f"Düzeltilen dosya sayısı: {len(changed)}")
          for item in changed:
              print(item)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Düzeltilecek eski Google Ads fiyat linki bulunamadı."
            exit 0
          fi
          git commit -m "Google Ads fiyat linklerini güncelle"
          git push
