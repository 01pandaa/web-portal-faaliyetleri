name: Repair video asset path

on:
  push:
    paths:
      - 'VIDEO-ASCII-FIX.md'
      - '.github/workflows/video-ascii-path-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy video to ASCII filename and update references
        shell: bash
        run: |
          set -e
          src='assets/Generating_digital_map_video_seq…_202609031415.mp4'
          dst='assets/web-portal-faaliyetleri-tanitim.mp4'
          test -f "$src"
          cp "$src" "$dst"

          python3 - <<'PY'
          from pathlib import Path
          old = 'Generating_digital_map_video_seq…_202609031415.mp4'
          new = 'web-portal-faaliyetleri-tanitim.mp4'
          files = [
              Path('index.html'),
              Path('video/web-portal-faaliyetleri-tanitim/index.html'),
              Path('sitemap.xml'),
          ]
          for path in files:
              if path.exists():
                  s = path.read_text(encoding='utf-8')
                  s = s.replace(old, new)
                  s = s.replace('</video autoplay>', '</video>')
                  path.write_text(s, encoding='utf-8')
          PY

          grep -q 'assets/web-portal-faaliyetleri-tanitim.mp4' video/web-portal-faaliyetleri-tanitim/index.html
          test -f assets/web-portal-faaliyetleri-tanitim.mp4

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html video/web-portal-faaliyetleri-tanitim/index.html sitemap.xml assets/web-portal-faaliyetleri-tanitim.mp4
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix video asset path and player markup [video-path-fix]'
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/video-ascii-path-fix.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-time video path repair workflow [video-path-fix]'
          git push
