name: Add city carousel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add draggable city carousel
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = '''<style id="WPF-CITY-CAROUSEL">.city-carousel{position:relative;width:100%;margin-top:4px}.city-carousel .city-grid{display:flex;grid-template-columns:none;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none;padding:6px 46px 12px;cursor:grab;user-select:none}.city-carousel .city-grid::-webkit-scrollbar{display:none}.city-carousel .city-grid.is-dragging{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}.city-carousel .city-card{flex:0 0 calc((100% - 48px)/4);min-width:0;scroll-snap-align:start}.city-carousel .city-card a{user-select:auto}.city-carousel-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:38px;height:38px;border:1px solid #b9ddd6;border-radius:50%;background:#fff;color:#158d7d;box-shadow:0 8px 22px #00000018;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer}.city-carousel-btn:hover{background:#e7f6f3}.city-carousel-btn.prev{left:0}.city-carousel-btn.next{right:0}.city-carousel-btn:disabled{opacity:.35;cursor:default}.city-carousel .city-card h3,.city-carousel .city-card.featured h3{color:#158d7d !important}@media(max-width:1000px){.city-carousel .city-card{flex-basis:calc((100% - 32px)/3)}}@media(max-width:700px){.city-carousel .city-grid{padding-left:40px;padding-right:40px}.city-carousel .city-card{flex-basis:calc((100% - 16px)/2)}}@media(max-width:520px){.city-carousel .city-card{flex-basis:82vw}.city-carousel-btn{width:34px;height:34px;font-size:20px}}</style>'''

          js = '''<script id="WPF-CITY-CAROUSEL">document.addEventListener('DOMContentLoaded',function(){var grid=document.querySelector('.city-grid');if(!grid||grid.dataset.carouselReady)return;grid.dataset.carouselReady='1';var wrap=document.createElement('div');wrap.className='city-carousel';grid.parentNode.insertBefore(wrap,grid);wrap.appendChild(grid);var prev=document.createElement('button');prev.className='city-carousel-btn prev';prev.type='button';prev.setAttribute('aria-label','Önceki şehirler');prev.innerHTML='&#8249;';var next=document.createElement('button');next.className='city-carousel-btn next';next.type='button';next.setAttribute('aria-label','Sonraki şehirler');next.innerHTML='&#8250;';wrap.append(prev,next);var step=function(){var card=grid.querySelector('.city-card');return card?card.getBoundingClientRect().width+16:300};var update=function(){var max=grid.scrollWidth-grid.clientWidth-2;prev.disabled=grid.scrollLeft<=2;next.disabled=grid.scrollLeft>=max};prev.addEventListener('click',function(){grid.scrollBy({left:-step(),behavior:'smooth'})});next.addEventListener('click',function(){grid.scrollBy({left:step(),behavior:'smooth'})});grid.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);var down=false,startX=0,startScroll=0;grid.addEventListener('pointerdown',function(e){if(e.button!==0)return;down=true;startX=e.clientX;startScroll=grid.scrollLeft;grid.classList.add('is-dragging');grid.setPointerCapture(e.pointerId)});grid.addEventListener('pointermove',function(e){if(!down)return;grid.scrollLeft=startScroll-(e.clientX-startX)});var end=function(){if(!down)return;down=false;grid.classList.remove('is-dragging')};grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end);grid.addEventListener('mouseleave',end);grid.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&grid.scrollWidth>grid.clientWidth){e.preventDefault();grid.scrollLeft+=e.deltaY}},{passive:false});update()});</script>'''

          if 'id="WPF-CITY-CAROUSEL"' not in html:
              html = html.replace('</head>', css + '</head>', 1)
          if 'id="WPF-CITY-CAROUSEL"' not in html or 'dataset.carouselReady' not in html:
              html = html.replace('</body>', js + '</body>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add draggable city carousel to homepage"
            git push origin main
          fi

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/add-city-carousel.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Workflow already absent"
          else
            git commit -m "chore: remove one-time city carousel workflow"
            git push origin main
          fi
