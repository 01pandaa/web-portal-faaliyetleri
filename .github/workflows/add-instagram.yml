name: Site maintenance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage video
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_src = 'assets/videos/web-portal-faaliyetleri-tanitim.mp4'
          new_src = 'assets/Generating_digital_map_video_seq…_202609031415.mp4'
          html = html.replace(old_src, new_src)

          pos = html.find(new_src)
          if pos != -1:
              start = html.rfind('<video', 0, pos)
              end = html.find('>', start)
              if start != -1 and end != -1:
                  tag = html[start:end + 1]
                  for attr in ('autoplay', 'muted', 'playsinline'):
                      if not re.search(r'\\b' + attr + r'\\b', tag):
                          tag = tag[:-1] + ' ' + attr
                  html = html[:start] + tag + html[end + 1:]

          path.write_text(html, encoding='utf-8')
          print('Homepage video autoplay attributes configured.')
          PY

      - name: Commit homepage video update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage video changes needed.'
            exit 0
          fi
          git commit -m 'Video otomatik oynatma ayari'
          git push
