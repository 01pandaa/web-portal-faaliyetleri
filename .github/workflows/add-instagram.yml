name: Add contact actions and normalize SEO URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  site-maintenance:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[site-maintenance]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add contact actions, normalize canonical host and connect service regions
        shell: python
        run: |
          from pathlib import Path

          actions = '''<div class="floating-actions" aria-label="Hızlı iletişim">
            <a class="float-whatsapp" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ile iletişime geç">WhatsApp</a>
            <a class="float-call" href="tel:+905451944026" aria-label="Web Portal Faaliyetleri'ni ara">Hemen Ara</a>
          </div>'''

          old_host = 'https://webportalfaaliyetleri.com'
          new_host = 'https://www.webportalfaaliyetleri.com'

          home_old_istanbul = '''<article class="city-card"><span class="city-label">SIRADAKİ BÖLGE</span><h3>İstanbul</h3><p>İstanbul için yerel hizmet, rekabet ve sektör bazlı arama niyetlerine göre yeni şehir sayfaları hazırlanıyor.</p></article>'''
          home_new_istanbul = '''<article class="city-card featured"><span class="city-label">AKTİF BÖLGE</span><h3>İstanbul</h3><p>İstanbul'da Google Ads çalışmalarını şehir geneliyle sınırlamıyor; Kadıköy, Beşiktaş, Şişli, Ataşehir, Ümraniye ve Bakırköy gibi önemli ilçelerde yerel arama niyetlerini ayrıca ele alıyoruz.</p><a href="/istanbul-google-ads/">İstanbul Google Ads Ajansı →</a><a href="/istanbul-google-ads/kadikoy/">Kadıköy</a><a href="/istanbul-google-ads/besiktas/">Beşiktaş</a><a href="/istanbul-google-ads/sisli/">Şişli</a><a href="/istanbul-google-ads/atasehir/">Ataşehir</a><a href="/istanbul-google-ads/umraniye/">Ümraniye</a><a href="/istanbul-google-ads/bakirkoy/">Bakırköy</a></article>'''

          home_old_ankara = '''<article class="city-card"><span class="city-label">SIRADAKİ BÖLGE</span><h3>Ankara</h3><p>Ankara'da kurumsal hizmetler, profesyonel işletmeler ve yerel aramalar için ayrı içerik mimarisi oluşturulacak.</p></article>'''
          home_new_ankara = '''<article class="city-card featured"><span class="city-label">AKTİF BÖLGE</span><h3>Ankara</h3><p>Ankara'da Google Ads çalışmalarını şehir geneliyle sınırlamıyor; Çankaya, Keçiören, Yenimahalle, Etimesgut, Sincan ve Altındağ gibi önemli ilçelerde farklı arama niyetlerini ayrıca ele alıyoruz.</p><a href="/ankara-google-ads/">Ankara Google Ads Ajansı →</a></article>'''

          home_old_mersin = '''<article class="city-card"><span class="city-label">SIRADAKİ BÖLGE</span><h3>Mersin</h3><p>Mersin'de yerel işletmeler, hizmet aramaları ve bölgesel reklam ihtiyaçları için yeni sayfalar hazırlanıyor.</p></article>'''
          home_new_mersin = '''<article class="city-card featured"><span class="city-label">AKTİF BÖLGE</span><h3>Mersin</h3><p>Mersin'de Google Ads çalışmalarını şehir geneliyle sınırlamıyor; Yenişehir, Mezitli, Toroslar, Akdeniz ve Tarsus gibi önemli bölgelerde farklı arama niyetlerini ayrıca ele alıyoruz.</p><a href="/mersin-google-ads/">Mersin Google Ads Ajansı →</a></article>'''

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(old_host, new_host)
              if path.as_posix() == 'index.html':
                  text = text.replace(home_old_istanbul, home_new_istanbul, 1)
                  text = text.replace(home_old_ankara, home_new_ankara, 1)
                  text = text.replace(home_old_mersin, home_new_mersin, 1)
              if 'class="float-whatsapp"' not in text and '</body>' in text:
                  text = text.replace('</body>', actions + '</body>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Commit site maintenance changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No site maintenance changes needed.'
            exit 0
          fi
          git commit -m 'Connect service region links [site-maintenance]'
          git push
