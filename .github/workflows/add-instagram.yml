name: Add contact actions and normalize SEO URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  site-maintenance:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[site-maintenance]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maintain contact actions, SEO URLs and service regions
        shell: python
        run: |
          from pathlib import Path
          import re

          actions = '''<div class="floating-actions" aria-label="Hızlı iletişim">
            <a class="float-whatsapp" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ile iletişime geç">WhatsApp</a>
            <a class="float-call" href="tel:+905451944026" aria-label="Web Portal Faaliyetleri'ni ara">Hemen Ara</a>
          </div>'''

          old_host = 'https://webportalfaaliyetleri.com'
          new_host = 'https://www.webportalfaaliyetleri.com'

          mersin = '''<article class="city-card featured"><span class="city-label">AKTİF BÖLGE</span><h3>Mersin</h3><p>Mersin'de Google Ads çalışmalarını şehir geneliyle sınırlamıyor; Yenişehir, Mezitli, Toroslar, Akdeniz ve Tarsus gibi önemli bölgelerde farklı arama niyetlerini ayrıca ele alıyoruz.</p><a href="/mersin-google-ads/">Mersin Google Ads Ajansı →</a></article>'''

          brand_video = 'assets/Generating_digital_map_video_seq…_202609031415.mp4'
          autoplay_script = '''<script>/* WPF-AUTOPLAY-ON-VIEW */
document.addEventListener('DOMContentLoaded',function(){
  const videos=document.querySelectorAll('video[data-autoplay-on-view="true"]');
  if(!videos.length)return;
  const observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      const video=entry.target;
      if(entry.isIntersecting && entry.intersectionRatio>=0.35){
        video.play().catch(function(){});
      }else{
        video.pause();
      }
    });
  },{threshold:[0,0.35]});
  videos.forEach(function(video){observer.observe(video);});
});</script>'''

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(old_host, new_host)
              if path.as_posix() == 'index.html':
                  pattern = r'<article class="city-card(?: featured)?"><span class="city-label">SIRADAKİ BÖLGE</span><h3>Mersin</h3>.*?</article>'
                  text, count = re.subn(pattern, mersin, text, count=1, flags=re.S)
                  if count == 0 and '/mersin-google-ads/' not in text:
                      marker = '<article class="city-card"><span class="city-label">SIRADAKİ BÖLGE</span><h3>Mersin</h3>'
                      if marker in text:
                          text = text.replace(marker, '<article class="city-card featured"><span class="city-label">AKTİF BÖLGE</span><h3>Mersin</h3>', 1)
                          text = text.replace('</article>', '<a href="/mersin-google-ads/">Mersin Google Ads Ajansı →</a></article>', 1)

                  # Brand video: bölüm görünür olduğunda otomatik oynat, bölümden çıkınca durdur.
                  pos = text.find(brand_video)
                  if pos != -1:
                      start = text.rfind('<video', 0, pos)
                      end = text.find('>', start)
                      if start != -1 and end != -1:
                          tag = text[start:end + 1]
                          for attr in ['autoplay', 'muted', 'playsinline']:
                              if attr not in tag:
                                  tag = tag[:-1] + ' ' + attr
                          if 'preload=' not in tag:
                              tag = tag[:-1] + ' preload="metadata"'
                          if 'data-autoplay-on-view' not in tag:
                              tag = tag[:-1] + ' data-autoplay-on-view="true"'
                          text = text[:start] + tag + text[end + 1:]

                  if 'WPF-AUTOPLAY-ON-VIEW' not in text and '</body>' in text:
                      text = text.replace('</body>', autoplay_script + '</body>', 1)

              if 'class="float-whatsapp"' not in text and '</body>' in text:
                  text = text.replace('</body>', actions + '</body>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Commit site maintenance changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No site maintenance changes needed.'
            exit 0
          fi
          git commit -m 'Connect Mersin service region link [site-maintenance]'
          git push
