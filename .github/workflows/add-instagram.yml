name: Add contact actions to HTML pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-contact-actions:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[contact-actions-installed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add WhatsApp and call buttons to HTML pages
        shell: python
        run: |
          from pathlib import Path

          actions = '''<div class="floating-actions" aria-label="Hızlı iletişim">
            <a class="float-whatsapp" href="https://wa.me/905451944026" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ile iletişime geç">WhatsApp</a>
            <a class="float-call" href="tel:+905451944026" aria-label="Web Portal Faaliyetleri'ni ara">Hemen Ara</a>
          </div>'''

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'class="float-whatsapp"' in text:
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', actions + '</body>', 1)
                  path.write_text(text, encoding='utf-8')

      - name: Commit contact actions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'Contact actions already installed.'
            exit 0
          fi
          git commit -m 'Add WhatsApp and call buttons to all pages [contact-actions-installed]'
          git push
