name: SEO Internal Link Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate internal links
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag != 'a':
                      return
                  href = dict(attrs).get('href')
                  if href:
                      self.links.append(href)

          roots = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          missing = []
          checked = 0

          def target_exists(href):
              parsed = urlparse(href)
              if parsed.scheme or href.startswith('#'):
                  return True
              path = parsed.path
              if not path.startswith('/'):
                  return True
              clean = path.strip('/')
              if not clean:
                  return Path('index.html').exists()
              direct = Path(clean)
              if direct.is_file():
                  return True
              if (direct / 'index.html').is_file():
                  return True
              return False

          for html_file in roots:
              parser = LinkParser()
              parser.feed(html_file.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith('/'):
                      checked += 1
                      if not target_exists(href):
                          missing.append(f'{html_file}: {href}')

          print(f'Kontrol edilen internal link: {checked}')
          if missing:
              print('Eksik internal linkler:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print('SEO internal link audit başarılı.')

      - name: Configure brand video autoplay on view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          video_src = 'assets/Generating_digital_map_video_seq…_202609031415.mp4'

          # Önce video dosya yolunu güvenli ve güncel hale getir.
          html = html.replace('assets/videos/web-portal-faaliyetleri-tanitim.mp4', video_src)

          pos = html.find(video_src)
          if pos == -1:
              print('Brand video source bulunamadı; autoplay adımı atlandı.')
              raise SystemExit(0)

          start = html.rfind('<video', 0, pos)
          end = html.find('>', start)
          if start == -1 or end == -1:
              print('Brand video etiketi bulunamadı; autoplay adımı atlandı.')
              raise SystemExit(0)

          tag = html[start:end + 1]
          for attr in ['autoplay', 'muted', 'playsinline']:
              if attr not in tag:
                  tag = tag[:-1] + ' ' + attr
          if 'preload=' not in tag:
              tag = tag[:-1] + ' preload="metadata"'
          if 'data-autoplay-on-view' not in tag:
              tag = tag[:-1] + ' data-autoplay-on-view="true"'

          html = html[:start] + tag + html[end + 1:]

          marker = 'WPF-AUTOPLAY-ON-VIEW'
          if marker not in html:
              script = '''<script>/* WPF-AUTOPLAY-ON-VIEW */
document.addEventListener('DOMContentLoaded',function(){
  const videos=document.querySelectorAll('video[data-autoplay-on-view="true"]');
  if(!videos.length)return;
  const observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      const video=entry.target;
      if(entry.isIntersecting && entry.intersectionRatio>=0.35){
        video.play().catch(function(){});
      }else{
        video.pause();
      }
    });
  },{threshold:[0,0.35]});
  videos.forEach(function(video){observer.observe(video);});
});</script>'''
              html = html.replace('</body>', script + '</body>')

          path.write_text(html, encoding='utf-8')
          print('Brand video görünür olduğunda otomatik oynatma için ayarlandı.')
          PY

      - name: Commit brand video behavior
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage video change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Video gorunur olunca otomatik oynat"
          git push
