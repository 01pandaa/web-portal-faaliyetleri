name: Fix city carousel clicks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix carousel drag behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          new_js = '''<script id="WPF-CITY-CAROUSEL">document.addEventListener('DOMContentLoaded',function(){var grid=document.querySelector('.city-grid');if(!grid||grid.dataset.carouselReady)return;grid.dataset.carouselReady='1';var wrap=document.createElement('div');wrap.className='city-carousel';grid.parentNode.insertBefore(wrap,grid);wrap.appendChild(grid);var prev=document.createElement('button');prev.className='city-carousel-btn prev';prev.type='button';prev.setAttribute('aria-label','Önceki şehirler');prev.innerHTML='&#8249;';var next=document.createElement('button');next.className='city-carousel-btn next';next.type='button';next.setAttribute('aria-label','Sonraki şehirler');next.innerHTML='&#8250;';wrap.append(prev,next);var step=function(){var card=grid.querySelector('.city-card');return card?card.getBoundingClientRect().width+16:300};var update=function(){var max=grid.scrollWidth-grid.clientWidth-2;prev.disabled=grid.scrollLeft<=2;next.disabled=grid.scrollLeft>=max};prev.addEventListener('click',function(){grid.scrollBy({left:-step(),behavior:'smooth'})});next.addEventListener('click',function(){grid.scrollBy({left:step(),behavior:'smooth'})});grid.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);var down=false,moved=false,startX=0,startScroll=0,pointerId=null;grid.addEventListener('pointerdown',function(e){if(e.button!==0)return;if(e.target.closest('a,button'))return;down=true;moved=false;startX=e.clientX;startScroll=grid.scrollLeft;pointerId=e.pointerId;grid.classList.add('is-dragging');grid.setPointerCapture(e.pointerId)});grid.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-startX;if(Math.abs(dx)>6)moved=true;grid.scrollLeft=startScroll-dx});var end=function(){if(!down)return;down=false;grid.classList.remove('is-dragging');if(pointerId!==null){try{grid.releasePointerCapture(pointerId)}catch(_){}pointerId=null}};grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end);grid.addEventListener('mouseleave',end);grid.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);grid.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&grid.scrollWidth>grid.clientWidth){e.preventDefault();grid.scrollLeft+=e.deltaY}},{passive:false});update()});</script>'''

          pattern = r'<script id="WPF-CITY-CAROUSEL">.*?</script>'
          updated, count = re.subn(pattern, new_js, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('WPF-CITY-CAROUSEL script bulunamadı')
          path.write_text(updated, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q "e.target.closest('a,button')" index.html
          grep -q "moved=false" index.html

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: allow city card links to be clicked'
          rm -f .github/workflows/fix-city-carousel-clicks.yml
          git add .github/workflows/fix-city-carousel-clicks.yml
          git commit -m 'chore: remove one-time carousel fix workflow'
          git push
