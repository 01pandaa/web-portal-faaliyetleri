name: Fix Adana SEO JSON-LD
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JSON-LD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('adana-seo-ajansi/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları."\n"primaryImageOfPage"', '"description":"Adana işletmeleri için teknik SEO, yerel SEO, içerik mimarisi, Google Maps görünürlüğü ve organik arama performansı çalışmaları.",\n  "image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"')
          html = html.replace('"primaryImageOfPage":{"@type":"ImageObject","url":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"},}', '"image":"https://www.webportalfaaliyetleri.com/assets/yerel-seo-google-haritalar.webp"\n}')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adana-seo-ajansi/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair Adana SEO JSON-LD"
          git push